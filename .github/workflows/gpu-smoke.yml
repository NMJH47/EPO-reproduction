name: GPU Smoke

on:
  workflow_dispatch:
    inputs:
      max_epochs:
        description: Number of smoke-test epochs
        required: true
        default: "2"
        type: string
      wandb_activate:
        description: Synchronize the smoke run to W&B
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gpu-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gpu-smoke:
    runs-on: [self-hosted, linux, x64, gpu, nvidia]
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify NVIDIA runtime
        shell: bash
        run: |
          nvidia-smi
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate epo
          export LD_LIBRARY_PATH="${CONDA_PREFIX}/lib:/usr/local/cuda-11.3/lib64:${LD_LIBRARY_PATH:-}"
          python - <<'PY'
          import isaacgym
          import torch

          assert torch.cuda.is_available(), "CUDA unavailable; CPU fallback is forbidden"
          print(torch.cuda.get_device_name(0))
          PY

      - name: Run Isaac Gym smoke test
        shell: bash
        env:
          EPO_SMOKE_MAX_EPOCHS: ${{ inputs.max_epochs }}
          EPO_WANDB_ACTIVATE: ${{ inputs.wandb_activate }}
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rl_games
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_ENTITY: ${{ vars.WANDB_ENTITY }}
          WANDB_PROJECT: ${{ vars.WANDB_PROJECT }}
        run: |
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate epo
          export LD_LIBRARY_PATH="${CONDA_PREFIX}/lib:/usr/local/cuda-11.3/lib64:${LD_LIBRARY_PATH:-}"
          bash scripts/smoke_test_epo_gpu.sh
