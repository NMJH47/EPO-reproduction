name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    name: Control-plane tests (no RL training)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.8
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.8"
          cache: pip

      - name: Install control-plane dependencies
        run: |
          python -m pip install --upgrade pip==23.3.1
          python -m pip install \
            hydra-core==1.3.2 \
            numpy==1.21.6 \
            omegaconf==2.3.0 \
            pytest==7.4.4 \
            pyyaml==6.0.1
          python -m pip install \
            torch==1.8.1+cpu \
            --find-links https://download.pytorch.org/whl/torch_stable.html

      - name: Check repository policy
        run: python scripts/ci/check_repo_policy.py

      - name: Check changed whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git diff --check "${BASE_SHA}"...HEAD
          else
            git diff-tree --check --root -r HEAD
          fi

      - name: Check shell syntax
        run: find scripts -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Compile Python sources
        run: python -m compileall -q isaacgymenvs rl_games/rl_games scripts tests

      - name: Test W&B control plane
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/rl_games
        run: pytest -q tests/test_wandb_reliability.py
