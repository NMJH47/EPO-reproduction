task:
  name: AllegroKuka
  physics_engine: ${..physics_engine}
  env:
    subtask: reorientation
    numEnvs: 20480
    envSpacing: 1.2
    episodeLength: 600
    enableDebugVis: false
    evalStats: false
    clampAbsObservations: 10.0
    stiffnessScale: 1.0
    forceLimitScale: 1.0
    useRelativeControl: false
    dofSpeedScale: 10.0
    actionsMovingAverage: 1.0
    controlFrequencyInv: 1
    resetPositionNoiseX: 0.1
    resetPositionNoiseY: 0.1
    resetPositionNoiseZ: 0.02
    resetRotationNoise: 1.0
    resetDofPosRandomIntervalFingers: 0.1
    resetDofPosRandomIntervalArm: 0.1
    resetDofVelRandomInterval: 0.5
    forceScale: 2.0
    forceProbRange:
    - 0.001
    - 0.1
    forceDecay: 0.99
    forceDecayInterval: 0.08
    liftingRewScale: 20.0
    liftingBonus: 300.0
    liftingBonusThreshold: 0.15
    keypointRewScale: 200.0
    distanceDeltaRewScale: 50.0
    reachGoalBonus: 1000.0
    kukaActionsPenaltyScale: 0.003
    allegroActionsPenaltyScale: 0.0003
    fallDistance: 0.24
    fallPenalty: 0.0
    privilegedActions: false
    privilegedActionsTorque: 0.02
    dofFriction: -1.0
    allegroStiffness: 40.0
    kukaStiffness: 40.0
    allegroEffort: 0.35
    kukaEffort:
    - 300
    - 300
    - 300
    - 300
    - 300
    - 300
    - 300
    allegroDamping: 5.0
    kukaDamping: 5.0
    allegroArmature: 0
    kukaArmature: 0
    keypointScale: 1.5
    objectBaseSize: 0.05
    randomizeObjectDimensions: true
    withSmallCuboids: true
    withBigCuboids: true
    withSticks: true
    objectType: block
    observationType: full_state
    successTolerance: 0.075
    targetSuccessTolerance: 0.01
    toleranceCurriculumIncrement: 0.9
    toleranceCurriculumInterval: 300
    maxConsecutiveSuccesses: 50
    successSteps: 1
    saveStates: false
    saveStatesFile: rootTensorsDofStates.bin
    loadInitialStates: false
    loadStatesFile: rootTensorsDofStates.bin
    goodResetBoundary: 0
    asset:
      kukaAllegro: urdf/kuka_allegro_description/kuka_allegro_touch_sensor.urdf
      assetFileNameBlock: urdf/objects/cube_multicolor.urdf
    useSparseReward: false
  task:
    randomize: false
    randomization_params:
      frequency: 480
      observations:
        range:
        - 0
        - 0.002
        range_correlated:
        - 0
        - 0.001
        operation: additive
        distribution: gaussian
        schedule: linear
        schedule_steps: 40000
      actions:
        range:
        - 0.0
        - 0.05
        range_correlated:
        - 0
        - 0.015
        operation: additive
        distribution: gaussian
        schedule: linear
        schedule_steps: 40000
      sim_params: null
      gravity:
        range:
        - 0
        - 0.4
        operation: additive
        distribution: gaussian
        schedule: linear
        schedule_steps: 40000
      actor_params:
        allegro:
          color: true
          dof_properties:
            damping:
              range:
              - 0.3
              - 3.0
              operation: scaling
              distribution: loguniform
              schedule: linear
              schedule_steps: 30000
            stiffness:
              range:
              - 0.75
              - 1.5
              operation: scaling
              distribution: loguniform
              schedule: linear
              schedule_steps: 30000
            lower:
              range:
              - 0
              - 0.01
              operation: additive
              distribution: gaussian
              schedule: linear
              schedule_steps: 30000
            upper:
              range:
              - 0
              - 0.01
              operation: additive
              distribution: gaussian
              schedule: linear
              schedule_steps: 30000
          rigid_body_properties:
            mass:
              range:
              - 0.5
              - 1.5
              operation: scaling
              distribution: uniform
              schedule: linear
              schedule_steps: 30000
          rigid_shape_properties:
            friction:
              num_buckets: 250
              range:
              - 0.7
              - 1.3
              operation: scaling
              distribution: uniform
              schedule: linear
              schedule_steps: 30000
        object:
          scale:
            range:
            - 0.5
            - 2.0
            operation: scaling
            distribution: uniform
            schedule: linear
            schedule_steps: 1
          rigid_body_properties:
            mass:
              range:
              - 0.5
              - 1.5
              operation: scaling
              distribution: uniform
              schedule: linear
              schedule_steps: 30000
          rigid_shape_properties:
            friction:
              num_buckets: 250
              range:
              - 0.7
              - 1.3
              operation: scaling
              distribution: uniform
              schedule: linear
              schedule_steps: 30000
  sim:
    substeps: 2
    dt: 0.01667
    up_axis: z
    use_gpu_pipeline: ${eq:${...pipeline},"gpu"}
    num_client_threads: 8
    gravity:
    - 0.0
    - 0.0
    - -9.81
    physx:
      num_threads: 6
      solver_type: 1
      num_position_iterations: 8
      num_velocity_iterations: 0
      max_gpu_contact_pairs: 8388608
      num_subscenes: ${....num_subscenes}
      contact_offset: 0.002
      rest_offset: 0.0
      bounce_threshold_velocity: 0.2
      max_depenetration_velocity: 1000.0
      default_buffer_size_multiplier: 25.0
      contact_collection: 0
train:
  params:
    seed: 36001
    algo:
      name: a2c_continuous
    model:
      name: continuous_a2c_logstd
    network:
      name: actor_critic
      separate: false
      space:
        continuous:
          mu_activation: None
          sigma_activation: None
          mu_init:
            name: default
          sigma_init:
            name: const_initializer
            val: 0
          fixed_sigma: coef_cond
      mlp:
        units:
        - 768
        - 512
        - 256
        activation: elu
        d2rl: false
        initializer:
          name: default
        regularizer:
          name: None
      rnn:
        name: lstm
        units: 768
        layers: 1
        before_mlp: true
        layer_norm: true
    load_checkpoint: ${if:${...checkpoint},True,False}
    load_path: ${...checkpoint}
    config:
      name: 118_structural_clip_higher_seed36001_N20480
      env_name: rlgpu
      multi_gpu: ${....multi_gpu}
      ppo: true
      mixed_precision: true
      normalize_input: true
      normalize_value: true
      normalize_advantage: true
      reward_shaper:
        scale_value: 0.01
      num_actors: ${....task.env.numEnvs}
      gamma: 0.99
      tau: 0.95
      learning_rate: 0.0001
      lr_schedule: adaptive
      schedule_type: standard
      kl_threshold: 0.016
      max_epochs: -1
      max_frames: 7000227840
      save_best_after: 100
      save_frequency: 0
      print_stats: true
      grad_norm: 1.0
      entropy_coef: 0.0
      truncate_grads: true
      e_clip: 0.1
      minibatch_size: 81920
      mini_epochs: 2
      critic_coef: 4.0
      clip_value: true
      horizon_length: 16
      seq_length: 16
      bounds_loss_coef: 0.0001
      defer_summaries_sec: ${if:${....pbt.enabled},240,5}
      summaries_interval_sec_min: ${if:${....pbt.enabled},60,5}
      summaries_interval_sec_max: 300
      summaries_flush_sec: 30
      log_per_block_metrics: true
      log_off_policy_grads: false
      good_reset_boundary: 0
      use_others_experience: lf
      off_policy_ratio: 1.0
      off_policy_actor_coef: 1.0
      off_policy_critic_coef: 0.0
      off_policy_support_mode: actor_clip
      expl_type: mixed_expl_learn_param
      expl_reward_coef_embd_size: 32
      expl_reward_coef_scale: 0.005
      expl_reward_type: entropy
      expl_coef_block_size: 320
      epo: true
      player:
        deterministic: false
        games_num: 100000
        print_stats: false
      expl_reward_coef: 0.0
      gradient_clip_scope: model
      cuda_allocator_cache_disabled: true
      release_cache_before_rollout: false
      release_completed_rollout_history: true
pbt:
  enabled: false
task_name: ${task.name}
